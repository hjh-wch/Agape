<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爱加倍</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebdbb6; --card:#f8f0dd; --line:#b4935c; --paper:#2b1a10; --muted:#7a644c; --seal:#b8322a;
  --gold:#a0620f; --ok:#2f6b3a; --bad:#b3261e;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) repeating-linear-gradient(92deg,rgba(120,80,30,.06) 0 1px,transparent 1px 8px);color:var(--paper);font-family:var(--sans);line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
small{color:var(--muted);font-size:.9rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 预览工具条:正式版会删除 */
.dev{background:#3a2314;border-bottom:1px solid var(--line);padding:.5rem .8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.8rem}
.dev b{color:#cdb691;font-weight:400;margin-right:auto}
.dev a,.dev button{background:transparent;color:#f6ecd6;border:1px solid #7a5a3a;border-radius:6px;padding:.3rem .7rem;font:inherit;cursor:pointer}
.dev a:hover,.dev button:hover{border-color:#f0c878;color:#f0c878}
.dev button:disabled{opacity:.4;cursor:default}

/* 雕刻边框:双层刻线,像牌匾四周的凹槽。这是本页唯一的装饰 */
.stitch{position:relative;background:var(--card) repeating-linear-gradient(88deg,rgba(150,100,40,.07) 0 1px,transparent 1px 11px);border-radius:6px;box-shadow:0 0 0 2px #b4935c,0 8px 22px rgba(90,60,20,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.stitch::before,.stitch::after{content:"";position:absolute;pointer-events:none}
.stitch::before{inset:7px;border:1px solid var(--line);border-radius:3px}
.stitch::after{inset:13px;border:2px solid var(--line);border-radius:2px}
.stitch.flash::after{animation:glow 1.6s ease-out}
.price{font-family:var(--serif);font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:lining-nums}
.ph{display:grid;place-items:center;font-family:var(--brush);color:#6a4122;text-shadow:0 2px 0 rgba(255,240,210,.45),0 -2px 0 rgba(0,0,0,.25)}
.big,.hero{box-shadow:inset 0 0 40px rgba(60,30,5,.3)}
.flash .price,.pulse .price{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1);text-shadow:none}30%{transform:scale(1.12);color:#f2b100;text-shadow:0 0 .35em rgba(255,200,30,.95),0 0 .9em rgba(255,190,0,.6)}100%{transform:scale(1);text-shadow:none}}
@keyframes glow{0%,40%{border-color:#f2b100;box-shadow:0 0 14px rgba(255,190,0,.8)}100%{border-color:var(--line);box-shadow:none}}

/* ---------- 大屏:一次一件 ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 3vw .6rem}
.bar h1{font-family:var(--brush);font-weight:400;letter-spacing:.1em;font-size:clamp(1.8rem,3vw,2.8rem);margin:0}
.bar span{color:var(--muted);font-size:clamp(1rem,1.5vw,1.3rem)}
.stage{padding:.6rem 3vw 3vh}
.stage .stitch{display:grid;grid-template-columns:1.45fr 1fr;gap:3vw;padding:2.2vw;min-height:calc(100vh - 150px)}
.stage .stitch>*{position:relative;z-index:1}
.big{position:relative;border-radius:4px;font-size:clamp(6rem,13vw,13rem);flex:1;min-height:240px}
.big img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.left{display:flex;flex-direction:column;gap:clamp(.8rem,2vh,1.4rem);min-width:0}
.left h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.8rem,3.4vw,3.6rem);line-height:1.15;margin:.1rem 0}
.rule{color:var(--muted);font-size:clamp(1rem,1.4vw,1.35rem);margin:0}
.right{display:flex;flex-direction:column;gap:clamp(1rem,3vh,2rem);min-width:0}
.top2{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.top2 .qr{flex:none;width:clamp(180px,15vw,290px)}
.pricebox{flex:1;display:flex;flex-direction:column;justify-content:center}
.pricebox .lab{font-size:clamp(1.1rem,1.7vw,1.6rem)}
.right .price{font-size:clamp(3.2rem,6.4vw,7.4rem);white-space:nowrap}
.lead{font-size:clamp(1.3rem,2.2vw,2.1rem);margin-top:.8rem}
.lead b{font-family:var(--serif);font-size:1.4em;margin-left:.3em}
.lead.none{color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(1.2rem,3.5vh,2.6rem);padding-top:.4rem}
.cd{text-align:center}
.cd span{display:block;color:var(--muted);font-size:clamp(1rem,1.5vw,1.3rem)}
.cd b{font-family:var(--serif);font-size:clamp(2.6rem,5.5vw,5rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.cd.end b{color:var(--bad)}
.qr{width:100%;max-width:340px;text-align:center;color:var(--paper);font-weight:700;font-size:clamp(1.2rem,1.9vw,1.9rem)}
.qr div{aspect-ratio:1;background:#fff;border-radius:12px;display:grid;place-items:center;color:#2a1710;font-weight:400;font-size:1.1rem;margin-bottom:.7rem}
.msg{min-height:calc(100vh - 150px);display:grid;place-content:center;text-align:center;gap:1rem;padding:2rem}
.msg h2{font-family:var(--serif);font-weight:900;font-size:clamp(2.4rem,6vw,5.5rem);margin:0}
.msg p{color:var(--muted);font-size:clamp(1.1rem,2vw,1.8rem);margin:0}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;max-width:1100px;margin:1.5rem auto 0;text-align:left}
.res{padding:1rem 1.2rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
.res b{display:block;font-family:var(--serif);font-size:1.15rem}
.res .price{font-size:1.9rem;margin-top:.4rem}
.res small{display:block;margin-top:.2rem}

.seal{position:absolute;right:5%;bottom:6%;font-family:var(--brush);font-size:clamp(2rem,4.5vw,4.2rem);line-height:1.1;color:#f6e9d0;background:var(--seal);border-radius:4px;padding:.08em .3em .14em;letter-spacing:.06em;outline:2px solid rgba(246,233,208,.45);outline-offset:-.14em;transform:rotate(-7deg);text-shadow:none}
.hero .seal{font-size:2.2rem}

/* ---------- 手机页 ---------- */
.wrap{max-width:480px;margin:0 auto;padding:1.2rem 1.2rem 3rem}
.no{display:block;margin-bottom:.6rem}
.hero{position:relative;overflow:hidden;height:210px;border-radius:4px;font-size:5rem;margin-bottom:1rem}
.bt{font-family:var(--serif);font-size:1.7rem;margin:.3rem 0 .2rem}
.stat{display:flex;justify-content:space-between;align-items:flex-end;padding:1.1rem 1.2rem;margin:.8rem 0 1.2rem}
.stat>*{position:relative;z-index:1}
.stat .price{font-size:2.9rem}
.stat .lead{font-size:1.05rem;margin:0;text-align:right}
.stat .lead b{display:block;margin:0;font-size:1.5em}
.mine{border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:700;text-align:center}
.mine.lead-ok{background:rgba(47,107,58,.12);color:var(--ok)}
.mine.out{background:rgba(179,38,30,.1);color:var(--bad)}
label{display:block;margin-bottom:1rem;font-weight:500}
input{width:100%;font:inherit;font-size:1.15rem;padding:.8rem .9rem;margin-top:.35rem;border-radius:10px;border:2px solid var(--line);background:#fffaf0;color:#2b1a10}
input:focus{border-color:var(--gold);outline:none}
.step{display:flex;gap:.5rem;align-items:center}
.step input{text-align:center;font-family:var(--serif);font-weight:900;font-size:1.6rem}
.step button{flex:none;width:56px;height:56px;margin-top:.35rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--paper);font-size:1.6rem;cursor:pointer}
.step button:active{border-color:var(--gold)}
.err{color:var(--bad);min-height:1.5em;margin:0 0 .5rem}
.go,.btn{display:block;width:100%;padding:1rem;border-radius:12px;border:0;background:#3a2314;color:#f8f0dd;font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--line);margin-top:.7rem}
.note{color:var(--muted);font-size:.85rem;margin-top:1rem}
.closed{padding:1.2rem;text-align:center;border:2px solid var(--bad);border-radius:12px;color:var(--bad);font-weight:700}
.wait{padding:3rem 1rem;text-align:center}
.wait h1{font-family:var(--serif);font-size:1.8rem;margin:0 0 .6rem}
.wait p{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(60,38,18,.55);display:grid;place-items:center;padding:1.2rem;z-index:9}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.6rem;width:100%;max-width:380px;text-align:center}
.modal h3{font-family:var(--serif);font-size:1.3rem;margin:0 0 .3rem}
.modal .price{font-size:3.4rem;margin:.8rem 0}
.modal p{margin:.2rem 0;color:var(--muted)}

@media (max-width:1100px){
  .stage .stitch{grid-template-columns:1fr}
  .big{flex:none;min-height:240px}
}
@media (max-width:860px){
  .stage .stitch{grid-template-columns:1fr;padding:5vw}
  .big{min-height:180px;font-size:7rem}
}

/* ---------- 管理页 ---------- */
.adm{max-width:1100px;margin:0 auto;padding:1rem 1.2rem 3rem}
.tabs{display:flex;gap:.4rem;margin:.8rem 0 1rem;border-bottom:2px solid var(--line)}
.tabs button{padding:.6rem 1.1rem;border:0;background:transparent;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--paper);border-bottom-color:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.st{display:flex;flex-wrap:wrap;gap:1rem 2.4rem;align-items:flex-end}
.nm{font-weight:700;font-size:1.25rem}
.bignum{font-family:var(--serif);font-weight:900;font-size:2.2rem;color:var(--gold);line-height:1.1}
.bignum.end{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.b{padding:.65rem 1.1rem;border-radius:8px;border:2px solid #3a2314;background:#3a2314;color:#f8f0dd;font:inherit;font-weight:700;cursor:pointer}
.b.line{background:transparent;color:var(--paper)}
.b.red{background:var(--seal);border-color:var(--seal)}
.b:disabled{opacity:.4;cursor:default}
.row2{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;margin-top:.5rem}
.row2 label{margin:0;flex:1;min-width:110px}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
.t th,.t td{padding:.5rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{color:var(--muted);font-weight:500}
.t input{margin:0;padding:.4rem .5rem;font-size:.95rem;border-radius:6px}
.t input.num{width:90px}
.t .b{padding:.3rem .6rem;margin-right:.3rem}
.nw{white-space:nowrap}
tr.void td{text-decoration:line-through;color:var(--muted)}


/* ---------- 一轮多件:大屏卡片 ---------- */
.stage .stitch.m{grid-template-columns:1fr clamp(240px,19vw,360px);gap:2vw}
.cards{display:grid;gap:1.1vw;min-width:0;position:relative;z-index:1}
.mc{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;font-size:var(--fs);background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:6px;padding:.7em;position:relative}
.mp{position:relative;flex:1;min-height:60px;border-radius:4px;font-size:4.2em;margin-bottom:.5em}
.mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mc h3{font-family:var(--serif);font-weight:900;font-size:1.3em;line-height:1.2;margin:.1em 0}
.mc small{font-size:.8em}
.mc .price{font-size:2.6em;white-space:nowrap}
.lead2{font-size:1.05em;margin-top:.3em;font-weight:500}
.lead2.none{color:var(--muted)}
.mc .seal{font-size:1.7em}
.mc.flash{animation:cglow 1.6s ease-out}
@keyframes cglow{0%,40%{border-color:#f2b100;box-shadow:0 0 14px rgba(255,190,0,.8)}100%{border-color:var(--line);box-shadow:none}}
.m .top2{flex-direction:column;align-items:center;gap:2vh}
.m .top2 .qr{width:100%;max-width:340px}
.rl{display:block;text-align:center;color:var(--muted);font-size:clamp(1rem,1.3vw,1.3rem)}
.tl{display:block;font-size:.6em;color:var(--muted);margin-top:.15em;font-weight:400}
@media (max-width:1100px){
  .stage .stitch.m{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:none!important}
  .mp{flex:none;height:110px}
}
/* ---------- 手机:本轮清单 ---------- */
.back{display:inline-block;color:var(--muted);padding:.3rem 0 .8rem}
.sub2{color:var(--muted);margin:0 0 1rem}
.li{display:flex;align-items:center;gap:1rem;padding:.7rem;margin-bottom:.7rem;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.th{width:64px;height:48px;border-radius:6px;font-size:1.8rem;flex:none;position:relative;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lm{flex:1;min-width:0}
.lm b{display:block;font-family:var(--serif)}
.li>span{color:var(--muted);font-size:1.4rem}
.li>span.tag{font-size:.8rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;white-space:nowrap}
.tag.ahead,.tag.win{background:rgba(47,107,58,.14);color:var(--ok)}
.tag.behind,.tag.lose{background:rgba(179,38,30,.1);color:var(--bad)}
select{width:100%;font:inherit;font-size:1.05rem;padding:.7rem;margin-top:.35rem;border-radius:10px;border:2px solid var(--line);background:#fffaf0;color:#2b1a10}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 1rem;margin:.6rem 0}
.c{display:flex;align-items:center;font-weight:400;margin:.35rem 0}
.c input{width:auto;margin:0 .6rem 0 0;transform:scale(1.25)}
.sel{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}

.idsum{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.7rem .9rem;margin-bottom:1rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
.idsum span{min-width:0;overflow-wrap:anywhere}
.idsum button{flex:none;border:2px solid var(--line);background:transparent;color:var(--paper);border-radius:8px;padding:.4rem .8rem;font:inherit;cursor:pointer}
.qr svg{width:90%;height:auto;display:block}
.nav{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.nav a{display:inline-block;text-decoration:none}

/* ---------- 各自提交金额的表单 ---------- */
.ic{display:flex;align-items:center;gap:.8rem;padding:.7rem;margin-bottom:.7rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ic .lm small{display:block}
.ic input{width:7.5rem;flex:none;margin:0;text-align:center;font-weight:700}
.ic.any{border-style:dashed}
.sent{color:var(--ok);font-weight:700}
.okb{padding:.8rem 1rem;margin-bottom:1rem;border-radius:10px;background:rgba(47,107,58,.12);color:var(--ok);font-weight:700;text-align:center}
.res2{padding:.8rem;margin-bottom:.7rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
.res2 b{font-family:var(--serif)}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- 预览工具条:只是为了现在看效果,正式版会删除(这些功能会放进管理页) -->

<div id="app"></div>

<script>
/* Firebase 设置在同一个文件夹的 config.js 里,更新网页时不用再改这里 */
const configured = typeof firebaseConfig !== 'undefined' && !/粘贴/.test(JSON.stringify(firebaseConfig));

/* ===== 其他设置 ===== */
const CUR = 'RM ', TAIL = 3, MAXROUND = 10;      // 币种、大屏显示手机尾号位数、一轮最多件数
const money = n => CUR + Number(n).toLocaleString('en-US');
const DEMO = [
  {name:'「福」字木雕牌匾',   emoji:'福', c1:'#d8b27a', c2:'#b98a52', min:200, photo:''},
  {name:'「家和万事兴」匾额', emoji:'和', c1:'#c9a068', c2:'#a77a47', min:300, photo:''},
  {name:'鲤鱼戏莲木雕摆件',   emoji:'鲤', c1:'#deba84', c2:'#c0955c', min:150, photo:''},
  {name:'观音木雕像',         emoji:'观', c1:'#cfa571', c2:'#b08350', min:250, photo:''},
  {name:'双龙戏珠木刻挂板',   emoji:'龙', c1:'#c59a63', c2:'#a5753f', min:200, photo:''},
  {name:'梅兰竹菊木刻屏风',   emoji:'梅', c1:'#d6ae78', c2:'#b98d55', min:350, photo:''},
  {name:'马到成功木雕摆件',   emoji:'马', c1:'#d3ab72', c2:'#b58650', min:180, photo:''},
  {name:'莲花木雕灯座',       emoji:'莲', c1:'#cda468', c2:'#ad7d48', min:120, photo:''},
  {name:'「寿」字木雕寿匾',   emoji:'寿', c1:'#dab67e', c2:'#bb8f58', min:260, photo:''},
  {name:'竹节木刻笔筒',       emoji:'竹', c1:'#d0a96f', c2:'#b2824c', min:90,  photo:''},
];
const BLANK = {status:'pending', top:null, table:null, tail:'', who:'', lastBid:null, roundNo:null};
const IDLE = {no:0, ids:[], status:'idle', finished:false, resolved:false, startedAt:null, durMs:0, extraMs:0};

/* ===== 状态(全部来自数据库) ===== */
let db, auth, user = null;
let items = [], R = null, round = null, finished = false;
let bids = [], adminErr = '';
let unsubs = [], adminUnsub = null, ready = {items:false, round:false}, shown = false, closing = false, autoNo = null;
let last = {}, viewKey = '', sel = [], durMin = 2, tab = 'live';

const $ = s => document.querySelector(s);
const get = id => items.find(i => i.id === id);
const roundItems = () => round ? round.ids.map(get).filter(Boolean) : [];
const isClosed = it => it.status === 'closed' || (!!round && round.ids.includes(it.id) && round.status !== 'open');
const pad = n => String(n).padStart(2,'0');
const fmt = ms => { const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+':':'')+pad(m)+':'+pad(s%60); };
const bg = it => `background:linear-gradient(135deg,${it.c1},${it.c2})`;
const face = it => it.photo ? `<img src="${esc(it.photo)}" alt="">` : it.emoji;
const norm = p => String(p || '').replace(/\D/g, '');
const tailOf = it => it.tail || '';
const leadHtml = it => it.top==null ? '无人参与'
  : `得标<b>${esc(it.who || '桌 '+it.table)}</b><small class="tl">${[it.who ? '桌 '+it.table : '', tailOf(it) ? '尾号 '+tailOf(it) : ''].filter(Boolean).join(',')}</small>`;
const leadShort = it => it.top==null ? '无人参与'
  : `得标 ${[it.who, '桌 '+it.table, tailOf(it) ? '尾号 '+tailOf(it) : ''].filter(Boolean).join(',')}`;
const key = () => `${round?round.no:0}:${round?round.status:''}:${round?round.resolved:''}:${finished}`;
const saved = () => { try { return JSON.parse(localStorage.getItem('bidder')) || {}; } catch(e){ return {}; } };
const save = (table, phone, name) => { try { localStorage.setItem('bidder', JSON.stringify({table, phone, name})); } catch(e){} };
const epoch = () => (R && R.epoch) || 0;      // 每次"清空演练数据"会换一个新编号,测试时留在手机里的记录就不再算数
const subKey = () => epoch() + ':' + (round ? round.no : 0);
const mySubs = () => { try { const m = JSON.parse(localStorage.getItem('mysubs')) || {}; return m.k === subKey() && m.s && !Array.isArray(m.s) ? m.s : {}; } catch(e){ return {}; } };
const remember = entries => { try { const o = mySubs(); entries.forEach(e => { if (e.amount > 0) o[e.item] = e.amount; else delete o[e.item]; }); localStorage.setItem('mysubs', JSON.stringify({k:subKey(), s:o})); } catch(e){} };
const total = () => items.reduce((a,i) => a + (isClosed(i) && i.top ? i.top : 0), 0);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== 数据库 ===== */
const FV = () => firebase.firestore.FieldValue;
const col = n => db.collection(n);
const itemRef = id => col('items').doc(id);
const roundRef = () => db.doc('state/round');

function applyRound(d){
  R = d;
  if (!d || d.status === 'idle'){ round = null; finished = !!(d && d.finished); return; }
  const st = d.startedAt && d.startedAt.toMillis ? d.startedAt.toMillis() : Date.now();
  const endAt = d.durMs > 0 ? st + d.durMs + (d.extraMs || 0) : null;
  round = {no:d.no, ids:d.ids || [], dbStatus:d.status, status:d.status, endAt, resolved:!!d.resolved};
  if (round.status === 'open' && endAt && Date.now() >= endAt) round.status = 'closed';
  finished = !!d.finished;
}
function startSync(){
  if (unsubs.length) return;
  unsubs.push(col('items').orderBy('order').onSnapshot(s => { items = s.docs.map(d => ({id:d.id, ...d.data()})); ready.items = true; enrich(); onData(); }, onErr));
  unsubs.push(roundRef().onSnapshot(s => { applyRound(s.exists ? s.data({serverTimestamps:'estimate'}) : null); ready.round = true; onData(); }, onErr));
}
function stopSync(){ unsubs.forEach(u => u()); unsubs = []; }
function onData(){ if (!(ready.items && ready.round)) return; if (!shown){ shown = true; return route(); } refresh(); }
function onErr(e){ $('#app').innerHTML = `<div class="wrap wait"><h1>连不上数据库</h1><p>请检查网络,或确认安全规则已经发布。(${esc(e.code || e.message)})</p></div>`; }

/* ===== 结果怎么算 =====
   0. 同一个人(按手机号)对同一件作品,或对"随机一件",只认他最后一次提交;金额 0 表示取消。
   1. 每件作品:指定这一件的金额里,最高的拿到(金额一样,先提交的拿到)。金额要不低于低价。
   2. 随机金额,按金额从高到低依次处理:
      在所有"他的金额能胜过目前最高金额"的作品里,拿走目前最高金额最低的那一件。
      (还没人提交的作品,目前最高金额当作它的低价。)
      被拿走的作品,原来的领先者就没有这一件了。 */
const better = (a, b) => !b || a.amount > b.amount || (a.amount === b.amount && a.time < b.time);
const keyOf = b => norm(b.phone) || 'n' + b.table + '|' + (b.who || '');
function effective(list){
  const m = {};
  list.slice().sort((a,b) => a.time - b.time).forEach(b => { m[keyOf(b) + '|' + b.item] = b; });
  return Object.values(m).filter(b => b.amount > 0);
}
function resolveRound(ids, list){
  const eff = effective(list), top = {};
  ids.forEach(id => top[id] = null);
  eff.filter(b => b.item !== '*' && ids.includes(b.item)).forEach(b => { const it = get(b.item); if (it && b.amount >= it.min && better(b, top[b.item])) top[b.item] = b; });
  eff.filter(b => b.item === '*').sort((a,b) => b.amount - a.amount || a.time - b.time).forEach(a => {
    const cands = ids.filter(id => { const it = get(id); return it && a.amount >= it.min && (!top[id] || better(a, top[id])); });
    if (!cands.length) return;
    const ref = id => top[id] ? top[id].amount : get(id).min;
    cands.sort((x,y) => ref(x) - ref(y) || ids.indexOf(x) - ids.indexOf(y));
    top[cands[0]] = a;
  });
  return top;
}
function enrich(){ items.forEach(it => { const w = bids.find(b => b.id === it.lastBid); it.phone = w ? w.phone : null; it.bidder = w ? w.who : (it.who || null); }); }

async function submitBids(entries, table, phone, source, who){
  try {
    const b = db.batch();
    entries.forEach(e => b.set(col('bids').doc(), {item:e.item, round:round.no, table:Number(table), amount:e.amount, phone, who:who||'', source:source||'guest', void:false, createdAt:FV().serverTimestamp()}));
    await b.commit();
    return {ok:true};
  } catch(e){
    if (e.code === 'permission-denied') return {ok:false, msg:'提交没有成功:这一轮可能已经结束。请看看大屏幕或刷新页面。(' + e.code + ')'};
    return {ok:false, msg:'网络出了问题,提交没有成功,请再试一次。'};
  }
}
async function publishResults(rno){
  const ids = round && round.no === rno ? round.ids : items.filter(i => i.roundNo === rno).map(i => i.id);
  await new Promise(r => setTimeout(r, 1500));                       // 等最后一刻的提交都到齐
  const snap = await col('bids').where('round', '==', rno).get();
  const list = snap.docs.map(d => { const x = d.data({serverTimestamps:'estimate'}); return {id:d.id, ...x, time: x.createdAt ? x.createdAt.toMillis() : 0}; }).filter(b => !b.void);
  const res = resolveRound(ids, list), b = db.batch();
  ids.forEach(id => { const w = res[id];
    b.update(itemRef(id), w ? {status:'closed', top:w.amount, table:w.table, tail:norm(w.phone).slice(-TAIL), who:w.who||'', lastBid:w.id}
                            : {status:'closed', top:null, table:null, tail:'', who:'', lastBid:null}); });
  if (round && round.no === rno) b.update(roundRef(), {resolved:true});
  await b.commit();
}
async function startRound(ids){
  ids = ids.filter(id => get(id) && get(id).status === 'pending').slice(0, MAXROUND);
  if (!ids.length || (round && round.status === 'open')) return;
  const no = (R && R.no || 0) + 1, b = db.batch();
  ids.forEach(id => b.update(itemRef(id), {status:'open', roundNo:no}));
  b.set(roundRef(), {no, ids, status:'open', resolved:false, startedAt:FV().serverTimestamp(), durMs: durMin > 0 ? Math.round(durMin*60000) : 0, extraMs:0, finished:false});
  sel = []; autoNo = null; await b.commit();
}
async function closeRound(){
  if (!round || round.dbStatus !== 'open') return;
  await roundRef().update({status:'closed'});      // 先关门,之后不再收新的提交
  await publishResults(round.no);
}
async function reopenRound(){
  if (!round || round.status === 'open') return;
  const b = db.batch();
  round.ids.forEach(id => b.update(itemRef(id), {...BLANK, status:'open', roundNo:round.no}));
  b.update(roundRef(), {status:'open', resolved:false, startedAt:FV().serverTimestamp(), durMs: durMin > 0 ? Math.round(durMin*60000) : 0, extraMs:0});
  autoNo = null; await b.commit();
}
async function setVoid(id, v){
  const x = bids.find(b => b.id === id); if (!x) return;
  await col('bids').doc(id).update({void:v});
  const ids = items.filter(i => i.roundNo === x.round);
  const resolved = round && round.no === x.round ? round.resolved : ids.length > 0 && ids.every(i => i.status === 'closed');
  if (resolved) await publishResults(x.round);      // 已经公布过的,作废后重新计算
}
async function seedDemo(){
  const base = items.reduce((m,i) => Math.max(m, i.order || 0), 0), b = db.batch();
  const have = new Set(items.map(i => i.name));
  DEMO.filter(d => !have.has(d.name)).forEach((d,i) => b.set(col('items').doc(), {...BLANK, ...d, photo:d.photo || '', order:base+i+1}));
  if (!R) b.set(roundRef(), IDLE);
  await b.commit();
}
async function deleteAll(){
  if (!confirm('确定要删除所有物品和所有提交记录吗?物品资料也会被删掉,不能撤销。')) return;
  if (!confirm('再确认一次:全部删除?')) return;
  for (let i = 0; i < bids.length; i += 400){ const b = db.batch(); bids.slice(i, i+400).forEach(x => b.delete(col('bids').doc(x.id))); await b.commit(); }
  for (let i = 0; i < items.length; i += 400){ const b = db.batch(); items.slice(i, i+400).forEach(x => b.delete(itemRef(x.id))); await b.commit(); }
  await roundRef().set({...IDLE, epoch:Date.now()}); sel = [];
}
async function resetAll(){
  if (!confirm('确定要清空所有提交记录,并把所有物品重置为"未开始"吗?这个操作不能撤销,只应该在演练之后使用。')) return;
  for (let i = 0; i < bids.length; i += 400){ const b = db.batch(); bids.slice(i, i+400).forEach(x => b.delete(col('bids').doc(x.id))); await b.commit(); }
  const b = db.batch(); items.forEach(it => b.update(itemRef(it.id), BLANK)); b.set(roundRef(), {...IDLE, epoch:Date.now()}); await b.commit(); sel = []; autoNo = null;
}

let qrCache = '';
function qrSvg(){
  if (qrCache) return qrCache;
  const url = location.href.split('#')[0].split('?')[0] + '#/bid';
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qrCache = q.createSvgTag(4, 8); }
  catch(e){ qrCache = `<span style="font-size:.8rem;padding:.5rem;word-break:break-all">${esc(url)}</span>`; }
  return qrCache;
}
const last_ = it => last[it.id];
const fl = it => last[it.id] !== undefined && last[it.id] !== it.top;
const sealOf = it => round && round.resolved && isClosed(it) ? '<span class="seal">结束</span>' : '';
function stateOf(it){                  // 大屏和手机上每件作品现在该显示什么
  if (round.status === 'open') return {lab:'低价', val:money(it.min), lead:'', short:'', none:true};
  if (!round.resolved) return {lab:'时间到', val:'统计中…', lead:'', short:'', none:true};
  if (it.top == null) return {lab:'低价', val:money(it.min), lead:'无人参与', short:'无人参与', none:true};
  return {lab:'最高金额', val:money(it.top), lead:leadHtml(it), short:leadShort(it), none:false};
}
function single(it){

  return `<main class="stage"><section class="stitch ${fl(it)?'flash':''}">
    <div class="left">
      <div class="big ph" style="${bg(it)}">${face(it)}${sealOf(it)}</div>

      <div class="top2"><div class="qr"><div>${qrSvg()}</div>扫码开始加倍</div>

      <div class="pricebox"><small class="lab">${v.lab}</small>
        <div class="price">${v.val}</div>
        <div class="lead ${v.none?'none':''}">${v.lead}</div></div>

function multi(ris){
  const n = ris.length;
  const cols = n<=3 ? n : n===4 ? 2 : n<=6 ? 3 : n<=8 ? 4 : 5, rows = Math.ceil(n/cols);
  const fs = n<=2 ? 'clamp(1rem,1.7vw,2.1rem)' : n<=4 ? 'clamp(.9rem,1.35vw,1.8rem)' : n<=6 ? 'clamp(.85rem,1.15vw,1.5rem)' : 'clamp(.75rem,.95vw,1.3rem)';
  return `<main class="stage"><section class="stitch m">
    <div class="cards" style="--fs:${fs};grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">
      ${ris.map(it => { const v = stateOf(it); return `<article class="mc ${fl(it)?'flash':''}">
        <div class="mp ph" style="${bg(it)}">${face(it)}${sealOf(it)}</div>
        <h3>${esc(it.name)}</h3><small>${v.lab}</small>
        <div class="price">${v.val}</div>
        <div class="lead2 ${v.none?'none':''}">${v.short}</div></article>`; }).join('')}
    </div>
    <div class="right"><div class="top2"><div class="qr"><div>${qrSvg()}</div>扫码开始加倍</div>
      <div class="cd" id="cdBox"><span id="cdLbl"></span><b id="cd"></b></div></div>
      <small class="rl">第 ${round.no} 轮,本轮 ${n} 件</small></div></section></main>`;
}
function viewScreen(){
  document.body.className = 'screen';
  const ris = roundItems();
  let body;
  if (finished) body = `<section class="msg"><h2>爱加倍全部结束</h2><p>本场爱加倍金额合计 <b style="color:var(--gold)">${money(total())}</b>。感谢大家的参与,得标者请留意工作人员联络。</p>
    <div class="results">${items.map(i => `<div class="res"><b>${esc(i.name)}</b>${i.top==null ? '<small>无人参与</small>' : `<div class="price">${money(i.top)}</div><small>${leadShort(i).replace('得标 ','')}</small>`}</div>`).join('')}</div></section>`;
  else if (!round || !ris.length) body = `<section class="msg"><h2>爱加倍即将开始</h2><p>今晚共 ${items.length} 件木刻作品。</p></section>`;

}

const meWin = it => { const s = saved(); return it.top != null && s.name && it.who === s.name && String(it.table) === String(s.table) && it.tail === norm(s.phone).slice(-TAIL); };
function viewBid(notice){

}
function viewForm(notice){

  $('#app').innerHTML = `<div class="wrap">

      <input class="amt2" data-item="${it.id}" inputmode="numeric" placeholder="金额" value="${subs[it.id]||''}" aria-label="${esc(it.name)}的金额"></div>`).join('')}
    ${ris.length > 1 ? `<div class="ic any">

      <input class="amt2" data-item="*" inputmode="numeric" placeholder="金额" value="${subs['*']||''}" aria-label="随机金额"></div>` : ''}

  </div>`;
  if ($('#editid')) $('#editid').onclick = () => { $('#idf').style.display = ''; $('#idsum').style.display = 'none'; };

function submit(){
  const err = m => { $('#err').textContent = m; };
  const showId = () => { $('#idf').style.display = ''; if ($('#idsum')) $('#idsum').style.display = 'none'; };
  const n = $('#who').value.trim(), t = $('#tb').value.trim(), p = $('#phone').value.trim();
  const ris = roundItems(), subs = mySubs(), entries = [];
  for (const el of document.querySelectorAll('.amt2')){
    const id = el.dataset.item, raw = el.value.trim(), prev = subs[id];
    if (!raw){ if (prev) entries.push({item:id, amount:0, prev}); continue; }          // 清空 = 取消这一件
    const a = parseInt(raw.replace(/[^\d]/g, ''), 10);
    if (!a) return err('请检查金额,只填数字。');
    const need = id === '*' ? Math.min(...ris.map(i => i.min)) : (get(id) || {}).min;
    if (a < need) return err(`${id === '*' ? '随机金额' : get(id).name + '的金额'}不能低于低价 ${money(need)}。`);
    if (a !== prev) entries.push({item:id, amount:a, prev});
  }
  if (!entries.length) return err(Object.keys(subs).length ? '没有需要更新的内容。要修改,请先改金额再提交。' : '请至少填写一个金额。');
  if (!n){ showId(); return err('请填写姓名。'); }
  if (!/^\d{1,3}$/.test(t)){ showId(); return err('请填写桌号,只填数字,例如 5。'); }
  if (norm(p).length < 8){ showId(); return err('手机号格式不对,请检查后再提交。'); }
  err('');
  const label = e => e.item === '*' ? '随机一件' : esc(get(e.item).name);
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">
      <h3>${entries.some(e => e.prev) ? '确认更改' : '确认提交'}</h3><p>${esc(n)},桌 ${esc(t)},手机 ${esc(p)}</p>
      <div style="text-align:left;margin:.8rem 0">${entries.map(e => `<p style="color:var(--paper)">${label(e)}:${e.prev ? money(e.prev) + ' → ' : ''}<b>${e.amount > 0 ? money(e.amount) : '取消'}</b></p>`).join('')}</div>
      <button class="btn" id="ok">确认</button>
      <button class="btn ghost" id="cancel">返回修改</button></div>`;
  document.body.appendChild(m);
  $('#cancel').onclick = () => m.remove();
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#ok').textContent = '提交中…';
    const r = await submitBids(entries.map(e => ({item:e.item, amount:e.amount})), t, p, 'guest', n);
    m.remove();
    if (!r.ok) return err(r.msg);
    save(t, p, n); remember(entries);
    viewForm('已提交,谢谢!时间结束前还可以修改,或继续填其他作品。');
  };
}

}

      <label>密码<input id="pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="lerr"></p><button class="go" id="login">登录</button></div>`;
    const go = async () => { try { await auth.signInWithEmailAndPassword($('#em').value.trim(), $('#pw').value); } catch(e){ $('#lerr').textContent = '登录失败:邮箱或密码不对。'; } };
    $('#login').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  if (adminErr){
    $('#app').innerHTML = `<div class="wrap wait"><h1>没有管理员权限</h1><p>这个账号的邮箱需要写进安全规则里的管理员名单。(${esc(adminErr)})</p><button class="btn ghost" data-act="logout">退出登录</button></div>`;
    return;
  }
  $('#app').innerHTML = `<div class="adm"><h1 class="bt">管理页</h1>
    <div class="nav"><a class="b line" href="#/screen" target="_blank">打开大屏页</a><a class="b line" href="#/bid" target="_blank">打开手机页</a><button class="b line" data-act="logout">退出登录</button></div>
    <div class="tabs">${[['live','现场控制'],['log','提交记录'],['items','物品管理'],['res','得标名单']]
      .map(([k,v]) => `<button class="${tab===k?'on':''}" data-act="tab" data-k="${k}">${v}</button>`).join('')}</div>
    <div id="tabBody"></div></div>`;
  renderTab();
}
function renderTab(){
  const b = $('#tabBody'); if (!b) return;
  if (tab === 'live'){
    b.innerHTML = `<div class="panel" id="liveStatus"></div>
      <div class="panel"><label>每轮爱加倍时长(分钟,填 0 表示不限时,由你手动结束)
        <input id="dur" inputmode="decimal" value="${durMin}"></label>
        <small>下次点"开始本轮"或"重新开放"时生效。</small></div>
      <div class="panel"><b>代录入(纸本)</b>
        <div class="row2"><label>作品<select id="pi"></select></label>
          <label>姓名<input id="pn"></label>
          <label>桌号<input id="pt" inputmode="numeric"></label>
          <label>手机号(可不填)<input id="pp" type="tel"></label>
          <label>金额<input id="pa" inputmode="numeric"></label>
          <button class="b" data-act="proxy">录入</button></div>
        <p class="err" id="pErr"></p></div>
      <div class="panel"><b>最近提交</b><div id="miniLog"></div></div>`;
  } else if (tab === 'log') b.innerHTML = '<div class="panel" id="logBox"></div>';
  else if (tab === 'items') b.innerHTML = itemsHtml();
  else b.innerHTML = '<div class="panel" id="resBox"></div>';
  adminRefresh();
}
function adminRefresh(){
  if (!user || adminErr) return;
  if (tab === 'live'){
    renderLive();
    const m = $('#miniLog'); if (m) m.innerHTML = logTable(bids.slice(-8).reverse());
    const pi = $('#pi');
    if (pi){ const v = pi.value, o = round && round.status==='open' ? roundItems() : [];
      pi.innerHTML = o.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('') + (o.length > 1 ? '<option value="*">随机一件</option>' : '');
      if (v && [...pi.options].some(x => x.value === v)) pi.value = v; }
  }
  if (tab === 'log' && $('#logBox')) $('#logBox').innerHTML = logTable(bids.slice().reverse());
  if (tab === 'res') renderRes();
  tick();
}
function selHtml(){
  const pend = items.filter(i => i.status === 'pending');
  if (!items.length) return '<p><small>还没有物品。请到"物品管理"点"载入物品清单",或新增物品。</small></p>';
  if (!pend.length) return '<p><small>没有待开始的物品了,可以点"结束全场"。</small></p>';
  const n = sel.filter(id => pend.some(p => p.id === id)).length;
  return `<div class="sel"><b>选择下一轮要开放的作品(最多 ${MAXROUND} 件)</b>
    <div class="chk">${pend.map(i => `<label class="c"><input type="checkbox" data-sel="${i.id}" ${sel.includes(i.id)?'checked':''}>${esc(i.name)}<small>&nbsp;低价 ${money(i.min)}</small></label>`).join('')}</div>
    <div class="btns"><button class="b" data-act="startRound" ${n && n<=MAXROUND ? '' : 'disabled'}>开始本轮(已选 ${n} 件)</button>
      <button class="b line" data-act="selAll">全选</button><button class="b line" data-act="selNone">清空</button></div>
    ${n > MAXROUND ? '<p class="err">一轮最多 '+MAXROUND+' 件,请取消几件。</p>' : ''}</div>`;
}
function liveRows(){
  const mine = bids.filter(b => b.round === round.no && !b.void);
  const prov = round.resolved ? null : resolveRound(round.ids, mine), eff = effective(mine);
  return round.ids.map(get).filter(Boolean).map(it => {
    const w = round.resolved ? (it.top == null ? null : {amount:it.top, who:it.who, table:it.table}) : prov[it.id];
    return `<tr><td>${esc(it.name)}</td><td>低价 ${money(it.min)}</td><td>${eff.filter(b => b.item === it.id).length} 人</td><td>${w ? money(w.amount) + ',' + esc(w.who||'') + ',桌 ' + w.table : '无'}</td></tr>`;
  }).join('') + `<tr><td colspan="4"><small>随机金额 ${eff.filter(b => b.item === '*').length} 人。同一个人只算最后一次提交。${round.resolved ? '以上是已经公布的结果。' : '最后一列是暂列的结果,只有管理页看得到,大屏和手机都看不到。'}</small></td></tr>`;
}
function renderLive(){
  const box = $('#liveStatus'); if (!box) return;
  const open = round && round.status === 'open';
  let h = '', btn = '';
  if (finished) h = '<b>全场已结束</b>';
  else {
    h = round
      ? `<div class="st"><b class="nm">第 ${round.no} 轮,共 ${round.ids.length} 件,${open?'进行中':round.resolved?'已结束,结果已公布':'时间到,统计中'}</b><div class="bignum" id="admCd"></div></div>
         <table class="t"><thead><tr><th>作品</th><th>低价</th><th>提交数</th><th>${round.resolved?'最高金额和得主':'暂列最高(仅管理页可见)'}</th></tr></thead><tbody>${liveRows()}</tbody></table>`
      : '<b>爱加倍尚未开始</b>';
    if (open) btn = '<button class="b line" data-act="ext" data-s="30">+30 秒</button><button class="b line" data-act="ext" data-s="60">+1 分钟</button><button class="b red" data-act="end">结束并公布结果</button>';
    else {
      if (round) btn += `<button class="b ${round.resolved?'line':''}" data-act="publish">${round.resolved?'重新计算并公布':'公布结果'}</button><button class="b line" data-act="reopen">重新开放本轮</button>`;
      btn += '<button class="b line" data-act="finish">结束全场</button>';
    }
  }
  box.innerHTML = h + `<div class="btns">${btn}</div>` + (!finished && !open ? selHtml() : '');
}
const logTable = list => !list.length ? '<small>还没有记录。</small>' :
  `<table class="t"><thead><tr><th>时间</th><th>作品</th><th>姓名</th><th>桌号</th><th>金额</th><th>手机号</th><th>来源</th><th></th></tr></thead><tbody>${list.map(b =>
  `<tr class="${b.void?'void':''}"><td>${clock(b.time)}</td><td>${esc(itemName(b.item))}</td><td>${esc(b.who||'')}</td><td>${b.table}</td><td>${b.amount > 0 ? money(b.amount) : '取消'}</td><td>${esc(b.phone)}</td><td>${b.source==='staff'?'工作人员':'宾客'}</td><td><button class="b line" data-act="void" data-id="${b.id}">${b.void?'恢复':'作废'}</button></td></tr>`).join('')}</tbody></table>`;
function itemsHtml(){
  return `<div class="panel"><table class="t"><thead><tr><th>#</th><th>名称</th><th>低价</th><th>照片路径</th><th>状态</th><th></th></tr></thead><tbody>
  ${items.map((it,i) => { const p = it.status === 'pending', d = p ? '' : 'disabled'; return `<tr><td>${i+1}</td>
    <td><input data-f="name" data-i="${i}" value="${esc(it.name)}" ${d}></td>
    <td><input class="num" data-f="min" data-i="${i}" inputmode="numeric" value="${it.min}" ${d}></td>
    <td><input data-f="photo" data-i="${i}" placeholder="photos/fu.jpg" value="${esc(it.photo)}" ${d}></td>
    <td>${stText(it)}</td>
    <td class="nw">${p ? `<button class="b line" data-act="mv" data-i="${i}" data-d="-1">↑</button><button class="b line" data-act="mv" data-i="${i}" data-d="1">↓</button><button class="b line" data-act="del" data-i="${i}">删除</button>` : ''}</td></tr>`; }).join('')}
  </tbody></table><div class="btns"><button class="b line" data-act="add">+ 新增物品</button></div>
  <p><small>照片放进网站的 photos 文件夹,再把路径填在这里;留空则显示占位图。已开始的物品不能再改。开始哪几件,在"现场控制"里勾选。</small></p></div>
  <div class="panel"><b>演练工具</b><p><small>"载入物品清单"会把网页文件里写好的清单加入(已有同名的不会重复加)。"清空演练数据"会删除所有提交记录并把物品重置,正式开始前使用。</small></p>
    <div class="btns"><button class="b line" data-act="seed">载入物品清单</button><button class="b red" data-act="reset">清空演练数据</button><button class="b red" data-act="delall">删除全部物品</button></div></div>`;
}
function people(){
  const m = {};
  items.filter(i => isClosed(i) && i.top != null).forEach(i => {
    const k = norm(i.phone) || '无手机号-桌' + i.table;
    const o = m[k] = m[k] || {who:i.bidder || '', phone:i.phone || '', tables:new Set(), list:[], sum:0};
    o.tables.add(i.table); o.list.push(i.name + ' ' + money(i.top)); o.sum += i.top;
  });
  return Object.values(m);
}
function renderRes(){
  const box = $('#resBox'); if (!box) return;
  box.innerHTML = `<b>按物品</b><table class="t"><thead><tr><th>物品</th><th>状态</th><th>最高金额</th><th>得标人</th><th>得标桌号</th><th>手机号</th></tr></thead><tbody>${items.map(it =>
    `<tr><td>${esc(it.name)}</td><td>${stText(it)}</td><td>${it.top==null?'—':money(it.top)}</td><td>${it.top==null?'—':esc(it.bidder||'')}</td><td>${it.top==null?'—':it.table}</td><td>${it.top==null?'—':esc(it.phone||'')}</td></tr>`).join('')}</tbody></table>
    <p><b>金额合计(已结束的):${money(total())}</b></p>
    <b>按个人汇总(收款用)</b>
    ${people().length ? `<table class="t"><thead><tr><th>姓名</th><th>手机号</th><th>桌号</th><th>得标物品</th><th>应付合计</th></tr></thead><tbody>${people().map(o =>
      `<tr><td>${esc(o.who)}</td><td>${esc(o.phone)}</td><td>${[...o.tables].join('、')}</td><td>${esc(o.list.join(';'))}</td><td>${money(o.sum)}</td></tr>`).join('')}</tbody></table>` : '<p><small>还没有已结束的项目。</small></p>'}
    <div class="btns"><button class="b" data-act="csv">下载 CSV(按物品)</button><button class="b" data-act="csv2">下载 CSV(按个人)</button><button class="b line" data-act="csv3">下载全部提交记录</button></div>`;
}
function download(rows, name){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
const txt = v => v ? '\t' + v : '';       // 手机号前加制表符,Excel 不会吃掉开头的 0
async function act(a, d){
  const open = round && round.status === 'open';
  try {
    if (a === 'logout') return auth.signOut();
    if (a === 'tab'){ tab = d.k; return viewAdmin(); }
    if (a === 'csv') return download([['物品','状态','最高金额','得标人','得标桌号','手机号'], ...items.map(i => [i.name, stText(i), i.top ?? '', i.bidder || '', i.top==null ? '' : i.table, txt(i.phone)])], 'results.csv');
    if (a === 'csv2') return download([['姓名','手机号','桌号','得标物品','应付合计'], ...people().map(o => [o.who, txt(o.phone), [...o.tables].join('、'), o.list.join(';'), o.sum])], 'by-person.csv');
    if (a === 'csv3') return download([['时间','作品','姓名','桌号','金额','手机号','来源','是否作废'], ...bids.map(b => [new Date(b.time).toLocaleString(), itemName(b.item), b.who || '', b.table, b.amount > 0 ? b.amount : '取消', txt(b.phone), b.source==='staff'?'工作人员':'宾客', b.void?'是':''])], 'all-bids.csv');
    if (a === 'selAll') sel = items.filter(i => i.status === 'pending').slice(0, MAXROUND).map(i => i.id);
    if (a === 'selNone') sel = [];
    if (a === 'startRound' && sel.length <= MAXROUND) await startRound(sel);
    if (a === 'ext' && open){
      if (R.durMs > 0) await roundRef().update({extraMs:FV().increment(+d.s*1000)});
      else await roundRef().update({startedAt:FV().serverTimestamp(), durMs:+d.s*1000, extraMs:0});
    }
    if (a === 'end' && open){ closing = true; autoNo = round.no; try { await closeRound(); } finally { closing = false; } }
    if (a === 'publish' && round && !open){ closing = true; autoNo = round.no; try { if (round.dbStatus === 'open') await roundRef().update({status:'closed'}); await publishResults(round.no); } finally { closing = false; } }
    if (a === 'reopen') await reopenRound();
    if (a === 'finish' && !open) await roundRef().set({finished:true}, {merge:true});
    if (a === 'void') await setVoid(d.id, !(bids.find(b => b.id === d.id) || {}).void);
    if (a === 'proxy'){
      const e = $('#pErr'), t = $('#pt').value.trim(), p = $('#pp').value.trim(), v = parseInt($('#pa').value,10), id = $('#pi').value;
      if (!id){ e.textContent = '现在没有进行中的作品。'; return; }
      if (!/^\d{1,3}$/.test(t)){ e.textContent = '请填写桌号(数字)。'; return; }
      if (!v){ e.textContent = '请填写金额。'; return; }
      const r = await submitBids([{item:id, amount:v}], t, p || '纸本', 'staff', $('#pn').value.trim());
      e.textContent = r.ok ? '' : r.msg;
      if (r.ok){ $('#pn').value = ''; $('#pt').value = ''; $('#pp').value = ''; $('#pa').value = ''; }
    }
    if (a === 'add') await col('items').doc().set({name:'新物品', emoji:'新', c1:'#d8b27a', c2:'#b98a52', min:100, photo:'', order:items.reduce((m,i) => Math.max(m, i.order||0), 0) + 1, ...BLANK});
    if (a === 'del') await itemRef(items[+d.i].id).delete();
    if (a === 'mv'){
      const x = items[+d.i], y = items[+d.i + +d.d];
      if (x && y && y.status === 'pending'){ const b = db.batch(); b.update(itemRef(x.id), {order:y.order}); b.update(itemRef(y.id), {order:x.order}); await b.commit(); }
    }
    if (a === 'seed') await seedDemo();
    if (a === 'reset') await resetAll();
    if (a === 'delall') await deleteAll();
  } catch(e){ alert('操作没有成功:' + (e.code || e.message)); }
  refresh();
  if (isAdmin() && tab === 'items') renderTab();
}
$('#app').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); });
$('#app').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dur') durMin = Math.max(0, parseFloat(t.value) || 0);
  if (t.dataset.sel){ sel = t.checked ? [...sel, t.dataset.sel] : sel.filter(x => x !== t.dataset.sel); renderLive(); }
  if (t.dataset.f){
    const x = items[+t.dataset.i], f = t.dataset.f;
    const v = f === 'min' ? Math.max(0, parseInt(t.value,10) || 0) : t.value.trim();
    itemRef(x.id).update({[f]:v}).catch(err => alert('保存失败:' + (err.code || err.message)));
  }
});

/* ===== 路由、计时 ===== */
const view = () => (location.hash || '#/screen').split('/')[1];
const isBid = () => view() === 'bid', isAdmin = () => view() === 'admin';
function route(){
  if (isAdmin()){ if (!unsubs.length) startSync(); return viewAdmin(); }
  if (isBid() && document.hidden) return;
  if (!unsubs.length) startSync();
  isBid() ? viewBid() : viewScreen();
}
function refresh(){
  if (isAdmin()) return user ? adminRefresh() : undefined;
  if (isBid()) return key() !== viewKey ? viewBid() : undefined;   // 开放期间数据不会变,不用重画,以免打断填写
  viewScreen();
}
function cdInfo(){
  if (!round) return null;
  if (round.status !== 'open') return ['本轮爱加倍', '已结束', true];
  if (round.endAt == null) return ['爱加倍', '进行中', false];
  const left = round.endAt - Date.now();
  return ['距离截止', fmt(left), left <= 10000];
}
function tick(){
  if (round && round.status === 'open' && round.endAt && Date.now() >= round.endAt){ round.status = 'closed'; refresh(); }
  if (user && round && !closing && autoNo !== round.no && round.status === 'closed' && !round.resolved){   // 管理页开着时,时间一到自动公布结果
    autoNo = round.no; closing = true;
    (round.dbStatus === 'open' ? closeRound() : publishResults(round.no))
      .catch(() => alert('自动公布结果没有成功,请到现场控制点"公布结果"。'))
      .finally(() => { closing = false; });
  }
  const c = cdInfo(); if (!c) return;
  const [l, t, urgent] = c;
  const cd = $('#cd'); if (cd){ cd.textContent = t; $('#cdLbl').textContent = l; $('#cdBox').classList.toggle('end', urgent); }
  const a = $('#admCd'); if (a){ a.textContent = t; a.classList.toggle('end', urgent); }
}

/* ===== 启动 ===== */
if (!configured){
  $('#app').innerHTML = '<div class="wrap wait"><h1>还没有填写 Firebase 设置</h1><p>请在 config.js 里填入 firebaseConfig。</p></div>';
} else if (typeof firebase === 'undefined'){
  $('#app').innerHTML = '<div class="wrap wait"><h1>无法加载 Firebase</h1><p>请检查网络后刷新页面。</p></div>';
} else {
  $('#app').innerHTML = '<div class="wrap wait"><h1>连接中…</h1></div>';
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.settings({experimentalAutoDetectLongPolling:true});   // 场地网络不好时自动换连接方式
  auth = firebase.auth();
  auth.onAuthStateChanged(u => {
    user = u; adminErr = ''; bids = [];
    if (adminUnsub){ adminUnsub(); adminUnsub = null; }
    if (u) adminUnsub = col('bids').orderBy('createdAt').onSnapshot(s => {
      bids = s.docs.map(d => { const x = d.data({serverTimestamps:'estimate'}); return {id:d.id, ...x, time: x.createdAt ? x.createdAt.toMillis() : Date.now()}; });
      enrich(); if (shown && isAdmin()) adminRefresh();
    }, e => { adminErr = e.code || 'error'; if (shown && isAdmin()) viewAdmin(); });
    if (shown && isAdmin()) viewAdmin();
  });
  window.addEventListener('hashchange', () => { if (shown) route(); else if (isAdmin()) { startSync(); } });
  document.addEventListener('visibilitychange', () => {   // 手机息屏时暂停连接,节省免费额度
    if (isAdmin() || !isBid()) return;
    document.hidden ? stopSync() : (ready = {items:false, round:false}, shown = false, startSync());
  });
  startSync();
  setInterval(tick, 1000);
}
</script>
</body>
</html>
